name: Feature Request
description: Suggest an improvement to the integration or the cards
title: "[Feature] "
labels: ["feature request"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Required fields must be filled in; skip the rest if they do not apply.

        This integration is local-only: it talks to the printer on your network and nothing else. Requests that need the Creality cloud, or values the printer does not actually report, cannot be built.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before You Submit
      options:
        - label: I searched the [existing issues](https://github.com/3dg1luk43/ha_creality_ws/issues) and this has not been requested.
          required: true
        - label: This is about this integration or its cards, not Home Assistant core or another integration.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: What you are trying to do, and what stops you today.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: What should happen. For card changes, suggest the config keys.
    validations:
      required: true

  - type: dropdown
    id: model_scope
    attributes:
      label: Printers Affected
      multiple: true
      options:
        - All printers
        - K1 family
        - K2 family
        - Ender 3 V3 family
        - Creality Hi
        - CFS-equipped printers
        - Other
    validations:
      required: true

  - type: textarea
    id: telemetry
    attributes:
      label: Telemetry / Data Source
      description: The WebSocket fields this would read, if you know them (from `ha_creality_ws.diagnostic_dump`). Sample frames are very welcome.
      render: json
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Mockups, screenshots, links.
    validations:
      required: false

  - type: checkboxes
    id: pr_intention
    attributes:
      label: Contributing an Implementation
      description: >
        Want to build it yourself? Agree the scope with the maintainer **before** writing code:
        tick the box, wait for the `accepted` label, then open a PR with `Closes #<this issue>`.
        A PR opened before the label is added is not reviewed and may be closed automatically.
        See [CONTRIBUTING.md](https://github.com/3dg1luk43/ha_creality_ws/blob/main/CONTRIBUTING.md#contributor-pr-flow-non-translation-prs).
      options:
        - label: I plan to submit a PR implementing this, and will wait for the `accepted` label before opening it.
          required: false
