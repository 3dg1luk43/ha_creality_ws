name: Tests

# The whole suite: ~800 static tests, including the card harnesses under
# tools/tests/js, which pytest drives through node. It runs in seconds, so
# unlike ha_washdata it stays on every push.

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the dev venv and what copilot-instructions.md promises;
        # 3.13 is what Home Assistant itself runs.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Install test dependencies
        # pyyaml: test_issue_validator_workflow.py reads the workflow it tests.
        run: pip install pytest voluptuous pyyaml
      - name: Run the test suite
        run: python -m pytest
