name: Tests

# The whole suite: ~800 static tests, including the card harnesses under
# tools/tests/js, which pytest drives through node. It runs in seconds, so
# unlike ha_washdata it stays on every push.

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.14 is what Home Assistant runs since 2026.7, the minimum this
        # release supports; 3.13 is the simulator's image (tools/testbox).
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          # Node 20 reached end of life on 2026-04-30.
          node-version: "22"
      - name: Install test dependencies
        # Pinned in one place, so a new release of a test dependency cannot
        # turn the suite red overnight. pyyaml: test_issue_validator_workflow.py
        # reads the workflow it tests.
        run: pip install -r tools/requirements-test.txt
      - name: Run the test suite
        run: python -m pytest
